<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault - Criar Conta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #0f1015; 
            --card: rgba(24, 25, 32, 0.85); 
            --primary: #7b2cbf; 
            --accent: #00f5d4; 
            --text: #f1f1f1; 
            --border: #272935; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;

            /* Foto de fundo */
            background: linear-gradient(rgba(15, 16, 21, 0.65), rgba(15, 16, 21, 0.65)),
                        url('/images/bg_login.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .auth-card { 
            background: var(--card); 
            backdrop-filter: blur(10px); 
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo { font-size: 1.8rem; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #9e9ea7; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: rgba(15, 16, 21, 0.8); border: 1px solid var(--border); color: #fff; border-radius: 6px; }
        button { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .alert { background: #e55151; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }
        .link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #9e9ea7; }
        .link a { color: var(--accent); text-decoration: none; }

        /* RESPONSIVO */
        @media (max-width: 480px) {
            body { padding: 16px; align-items: flex-start; padding-top: 8vh; }
            .auth-card { padding: 24px 20px; }
            .logo { font-size: 1.5rem; }
            input { font-size: 16px; } /* evita zoom automático no iOS */
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="logo"><i class="fa-solid fa-gamepad"></i> GameVault</div>
    <h3 style="text-align: center; margin-bottom: 20px;">Criar Nova Conta</h3>

    <div th:if="${erro}" class="alert" th:text="${erro}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="form-group">
            <label>Nome de Exibição</label>
            <input type="text" th:field="*{nomeExibicao}" required placeholder="ex: Player One" />
        </div>
        <div class="form-group">
            <label>Usuário (Login)</label>
            <input type="text" th:field="*{username}" required placeholder="ex: player1" />
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" th:field="*{senha}" required placeholder="Sua senha" />
        </div>
        <button type="submit">Cadastrar</button>
    </form>

    <div class="link">
        Já tem conta? <a href="/login">Faça Login</a>
    </div>
</div>

</body>
</html>
