<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #0f1015; 
            --card: rgba(24, 25, 32, 0.85); /* Fundo semi-transparente estilo vidro */
            --primary: #7b2cbf; 
            --accent: #00f5d4; 
            --text: #f1f1f1; 
            --border: #272935; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;

            /* Foto de fundo bg_login.jpg cobrindo a tela inteira */
            background-color: var(--bg);
            background-image: linear-gradient(rgba(15, 16, 21, 0.65), rgba(15, 16, 21, 0.65)), 
                              url('/images/bg_login.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
        }

        .auth-card { 
            background: var(--card) !important; 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            padding: 40px; 
            border-radius: 12px; 
            border: 1px solid var(--border); 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo { font-size: 1.8rem; font-weight: 800; color: var(--accent); text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #9e9ea7; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; background: rgba(15, 16, 21, 0.8); border: 1px solid var(--border); color: #fff; border-radius: 6px; }
        input:focus { outline: none; border-color: var(--accent); }
        button { width: 100%; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .alert { background: #e55151; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }
        .success { background: #27ae60; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 15px; text-align: center; }
        .link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #9e9ea7; }
        .link a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="logo"><i class="fa-solid fa-gamepad"></i> GameVault</div>
    <h3 style="text-align: center; margin-bottom: 20px;">Entrar na Conta</h3>

    <div th:if="${erro}" class="alert" th:text="${erro}"></div>
    <div th:if="${param.sucesso}" class="success">Conta criada com sucesso! Faça login.</div>

    <form th:action="@{/login}" th:object="${usuario}" method="post">
        <div class="form-group">
            <label>Usuário</label>
            <input type="text" th:field="*{username}" required placeholder="Digite seu usuário" />
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" th:field="*{senha}" required placeholder="Digite sua senha" />
        </div>
        <button type="submit">Entrar</button>
    </form>

    <div class="link">
        Não tem conta? <a href="/registro">Cadastre-se</a>
    </div>
</div>

</body>
</html>
