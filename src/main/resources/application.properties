spring.application.name=gamevault

# Configurações da Base de Dados H2 (em arquivo: os dados persistem em ./data)
spring.datasource.url=jdbc:h2:file:./data/gamevault;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Activar a consola web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualização automática das tabelas JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true